<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <style>
      /* Light theme (default): gradient tile, white letter */
      .bg { fill: url(#brand); }
      .fg { fill: #ffffff; }
      /* Dark theme: dark tile, gradient letter */
      @media (prefers-color-scheme: dark) {
        .bg { fill: #111827; }
        .fg { fill: url(#brand); }
      }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="64" height="64" rx="12"/>
  <text class="fg" x="50%" y="54%" dominant-baseline="central" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800">R</text>
</svg>
